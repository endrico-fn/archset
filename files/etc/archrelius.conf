# /etc/archrelius.conf
# Preview live before rebuilding UKI: /usr/local/lib/systemd/archrelius-askpw --preview
# Rebuild UKI after edits: sudo mkinitcpio -P

intro             = true
banner            = true
compact_title     = ARCHRELIUS
idle_timeout_sec  = 15
# Password typing indicator: masked | blocks | pulse | hidden
password_feedback = masked

accent_color      = #64beaf
highlight_color   = #8ae3d2
mid_color         = #3d8f83
deep_color        = #235952
cyan_green_color  = #52a899
dim_color         = #465956
soft_white_color  = #d8e6e3
error_color       = #e06c75
success_color     = #56b88d
