#!/usr/bin/nft -f
# vim:set ts=2 sw=2 et:

# IPv4-only firewall ruleset (synchronized with IPv6 disabled globally).
# More examples in /usr/share/nftables/ and /usr/share/doc/nftables/examples/.

destroy table inet filter

table inet filter {

  chain input {
    type filter hook input priority filter; policy drop;

    # =========================================================================
    # 1. FAST-PATH: LOOPBACK, INVALID, STRONG HOST MODEL & CONNTRACK
    # =========================================================================
    # Izinkan semua trafik loopback (IPC lokal, systemd-resolved <-> dnscrypt-proxy)
    iif "lo" accept comment "Allow all loopback traffic"

    # Buang segera paket invalid sebelum evaluasi lebih lanjut
    ct state invalid counter drop comment "Drop invalid input connections"

    # Blokir penuh trafik IPv6 non-loopback (sinkron dengan IPv6 disabled)
    meta nfproto ipv6 counter drop comment "Drop all non-loopback IPv6 input"

    # Strong Host Model (ArchWiki nftables): buang paket untuk IP yang tidak terpasang di interface masuk
    fib daddr . iif type != { local, broadcast, multicast } counter drop comment "Drop packets for IP not configured on incoming interface (strong host model)"

    # Fast-path untuk koneksi yang sudah terverifikasi berasal dari host ini
    ct state { established, related } accept comment "Accept established and related connections"

    # =========================================================================
    # 2. ANTI-SPOOFING & MALFORMED TCP FLAG PROTECTION
    # =========================================================================
    # Blokir paket eksternal yang memalsukan alamat loopback IPv4
    iif != "lo" ip saddr 127.0.0.0/8 counter drop comment "Drop spoofed IPv4 loopback"

    # Drop paket TCP baru yang tidak diawali flag SYN (mencegah SYN-ACK/FIN/Xmas/Null scans)
    tcp flags & (fin | syn | rst | ack) != syn ct state new counter drop comment "Drop non-SYN new TCP connections"

    # Drop paket TCP dengan kombinasi flag tidak wajar (SYN+FIN atau SYN+RST)
    tcp flags & (syn | fin) == (syn | fin) counter drop comment "Drop bogus SYN+FIN packets"
    tcp flags & (syn | rst) == (syn | rst) counter drop comment "Drop bogus SYN+RST packets"

    # =========================================================================
    # 3. ICMPv4 (SAFE DIAGNOSTICS & PATH MTU DISCOVERY)
    # =========================================================================
    # Gunakan `icmp type` secara langsung (otomatis menyertakan meta l4proto icmp)
    icmp type {
      destination-unreachable,
      time-exceeded,
      parameter-problem
    } accept comment "Allow critical ICMPv4 PMTUD errors"

    # Rate-limit ping IPv4; paket ping yang melebihi batas langsung di-drop agar tidak memicu ICMP reject
    icmp type echo-request limit rate 5/second burst 10 packets accept comment "Allow rate-limited ICMPv4 ping"
    icmp type echo-request counter drop comment "Drop excessive ICMPv4 ping floods"

    # =========================================================================
    # 4. OPTIONAL SERVICE EXCEPTIONS (UNCOMMENT WHEN NEEDED)
    # =========================================================================
    # Example 1: Izinkan SSH hanya melalui interface WireGuard (png0)
    # iifname "png0" tcp dport 22 ct state new accept comment "Allow SSH via WireGuard png0 only"

    # Example 2: Izinkan LocalSend pada jaringan LAN rumah yang tepercaya
    # udp dport 53317 ct state new accept comment "LocalSend UDP"
    # tcp dport 53317 ct state new accept comment "LocalSend TCP"

    # =========================================================================
    # 5. GRACEFUL RATE-LIMITED REJECTION
    # =========================================================================
    # Tolak paket unicast dengan sopan (maks 10/detik) agar aplikasi lokal tidak hang saat probing
    # Trafik broadcast/multicast di Wi-Fi publik otomatis di-drop secara senyap oleh policy drop
    pkttype host limit rate 10/second counter reject with icmpx type admin-prohibited comment "Polite rate-limited unicast reject"
  }

  chain forward {
    type filter hook forward priority filter; policy drop;

    # Uncomment jika menggunakan bridge container (Docker / Podman) di masa mendatang:
    # ct state vmap { established : accept, related : accept, invalid : drop }
    # tcp flags syn tcp option maxseg size set rt mtu comment "Clamp MSS to PMTU for forwarded traffic"
    # iifname { "docker0", "podman*" } accept
  }

  chain output {
    type filter hook output priority filter; policy accept;

    # =========================================================================
    # 1. FAST-PATH & INVALID PACKET LEAK PREVENTION
    # =========================================================================
    # Izinkan penuh trafik internal loopback (127.0.0.53 -> 127.0.0.1:5300)
    oif "lo" accept comment "Allow all local loopback output"

    # Cegah kebocoran IPv6 saat race kondisi interface naik
    meta nfproto ipv6 counter drop comment "Prevent IPv6 outbound leaks"

    # Cegah kebocoran paket out-of-state (misal saat tunnel WireGuard png0 putus/berpindah)
    ct state vmap { established : accept, related : accept, invalid : drop } comment "Drop invalid outbound packets"

    # =========================================================================
    # 2. OUTBOUND DNS LEAK PROTECTION (ENFORCE DNSCRYPT-PROXY)
    # =========================================================================
    # Izinkan IP netprobe & bootstrap Quad9 (9.9.9.9 & 149.112.112.112) pada port 53 dengan rate-limit ketat
    # agar pengecekan konektivitas awal dnscrypt-proxy jalan tanpa membuka celah bypass DNS penuh
    ip daddr { 9.9.9.9, 149.112.112.112 } udp dport 53 limit rate 10/minute burst 15 packets accept comment "Allow rate-limited dnscrypt-proxy UDP bootstrap"
    ip daddr { 9.9.9.9, 149.112.112.112 } tcp dport 53 limit rate 10/minute burst 15 packets accept comment "Allow rate-limited dnscrypt-proxy TCP bootstrap"

    # Blokir semua aplikasi yang mencoba mem-bypass dnscrypt-proxy via port 53 (DNS) atau 853 (DoT/DoQ)
    meta l4proto { tcp, udp } th dport { 53, 853 } counter reject comment "Block direct outbound DNS/DoT/DoQ bypass"
  }
}
