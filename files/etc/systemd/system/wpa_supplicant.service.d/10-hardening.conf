# Managed by archset — sandboxes root wpa_supplicant against over-the-air 802.11/EAP exploits
# while preserving nl80211, EAPOL (AF_PACKET), D-Bus, /run/wpa_supplicant, and /dev/rfkill.
[Service]
ProtectSystem=strict
RuntimeDirectory=wpa_supplicant
RuntimeDirectoryMode=0750
ProtectHome=true
PrivateTmp=true
DevicePolicy=closed
DeviceAllow=/dev/rfkill rw
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectKernelLogs=true
ProtectControlGroups=true
ProtectClock=true
ProtectHostname=true
NoNewPrivileges=true
RestrictSUIDSGID=true
RestrictRealtime=true
LockPersonality=true
MemoryDenyWriteExecute=true
SystemCallArchitectures=native
RestrictNamespaces=true
CapabilityBoundingSet=CAP_NET_ADMIN CAP_NET_RAW
RestrictAddressFamilies=AF_UNIX AF_NETLINK AF_PACKET AF_INET AF_INET6
