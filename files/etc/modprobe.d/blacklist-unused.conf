# Managed by archset — disable unused rare network protocols & FireWire DMA attack surface.
# Note: WebRTC uses userspace SCTP over UDP (usrsctp/dcSCTP), never kernel sctp.ko.
# usb-storage is intentionally NOT disabled on a personal workstation.

blacklist sctp
install sctp /usr/bin/false

blacklist rds
install rds /usr/bin/false

blacklist tipc
install tipc /usr/bin/false

blacklist firewire-core
install firewire-core /usr/bin/false

blacklist firewire-ohci
install firewire-ohci /usr/bin/false

blacklist firewire-sbp2
install firewire-sbp2 /usr/bin/false
