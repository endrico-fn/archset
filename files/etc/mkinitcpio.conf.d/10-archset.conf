# Managed by archset — overrides /etc/mkinitcpio.conf without touching upstream defaults.
# Modern systemd-based initramfs with sd-encrypt (LUKS2 passphrase-only, no TPM2).
# Keep 'base' before 'systemd' so an emergency rescue shell remains available.
MODULES=(i915)
HOOKS=(base systemd autodetect microcode modconf kms keyboard sd-vconsole block sd-encrypt filesystems)
