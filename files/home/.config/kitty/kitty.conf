# ==============================================================================
# FONTS (JetBrains Mono)
# ==============================================================================
# bold_font, italic_font, dan bold_italic_font otomatis bernilai 'auto' di Kitty
font_family      JetBrains Mono
font_size        9.0
# modify_font      cell_height 110%

# ==============================================================================
# CURSOR & MOUSE
# ==============================================================================
cursor_shape     beam
url_color        #56b88d
copy_on_select   clipboard

# ==============================================================================
# PERFORMANCE & AUDIO (Optimal untuk Wayland)
# ==============================================================================
# Menurunkan latency input untuk responsivitas ketik di Neovim
input_delay      1
enable_audio_bell no

# ==============================================================================
# LAYOUT & WINDOW SPLITS
# ==============================================================================
# Hanya mengaktifkan layout 'splits' (tiling bebas) dan 'stack' (zoom/maximize)
enabled_layouts        splits:split_axis=horizontal,stack
window_border_width    1pt
window_padding_width   6
placement_strategy     center
inactive_text_alpha    0.75

# ==============================================================================
# TAB BAR
# ==============================================================================
# tab_bar_edge (bottom) dan tab_bar_min_tabs (2) sudah default, tidak ditulis ulang
tab_bar_style          powerline
tab_powerline_style    slanted
tab_title_template     "{index}: {title[title.rfind('/')+1:]}"
active_tab_font_style  bold

# ==============================================================================
# COLOR SCHEME (Neutral Deep Dark Grey & Accent #56b88d)
# ==============================================================================
# Neutral Deep Dark Grey (Tanpa tint biru/warm)
background              #141414
foreground              #e0e0e0

# Selection
selection_background    #56b88d
selection_foreground    #141414

# Cursor
cursor                  #56b88d
cursor_text_color       #141414

# Window Borders (Splits)
active_border_color     #56b88d
inactive_border_color   #262626
bell_border_color       #e5c07b

# Tab Bar Colors
active_tab_background   #56b88d
active_tab_foreground   #141414
inactive_tab_background #1f1f1f
inactive_tab_foreground #888888
tab_bar_background      #0d0d0d

# 16-Color ANSI Palette (Neutral Balanced)
# Black / Dark Grey
color0  #1f1f1f
color8  #525252

# Red
color1  #e06c75
color9  #f07178

# Green (Tersinkronisasi dengan Accent #56b88d)
color2  #56b88d
color10 #6ee7b7

# Yellow
color3  #e5c07b
color11 #f0d192

# Blue
color4  #61afef
color12 #7cc0f7

# Magenta
color5  #c678dd
color13 #d492e8

# Cyan
color6  #56b6c2
color14 #6bcad6

# White / Light Grey
color7  #cccccc
color15 #ffffff

# ==============================================================================
# KEYBINDINGS (Nol Redundansi Default)
# ==============================================================================
# --- Pembuatan Split (Membuka di direktori aktif / cwd saat ini) ---
map alt+shift+v launch --location=vsplit --cwd=current
map alt+shift+s launch --location=hsplit --cwd=current

# Menukar orientasi split (Horizontal <-> Vertikal) & Zoom Toggle
map alt+shift+r layout_action rotate
map alt+shift+z toggle_layout stack

# --- Navigasi Antar Split (Alt + Shift + h/j/k/l; bebas konflik Neovim <A-*>) ---
map alt+shift+h neighboring_window left
map alt+shift+j neighboring_window down
map alt+shift+k neighboring_window up
map alt+shift+l neighboring_window right

# --- Memindahkan Posisi Split ---
map ctrl+alt+h move_window left
map ctrl+alt+j move_window down
map ctrl+alt+k move_window up
map ctrl+alt+l move_window right

# --- Mengubah Ukuran (Resize) Split ---
map ctrl+alt+left  resize_window narrower 3
map ctrl+alt+right resize_window wider 3
map ctrl+alt+up    resize_window taller 3
map ctrl+alt+down  resize_window shorter 3
map ctrl+alt+0     resize_window reset
